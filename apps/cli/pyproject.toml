[project]
name = "yt-finder-cli"
version = "0.1.0"
description = "Terminal application for transcript collection and video search"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
yt = "yt_cli.launcher:main"
yt-collect = "yt_cli.launcher:collector_entry"
yt-search = "yt_cli.launcher:search_entry"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yt_cli"
