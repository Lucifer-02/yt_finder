[project]
name = "yt-finder"
version = "0.1.0"
description = "YouTube transcript collection and search with CLI and local web applications"
requires-python = ">=3.13"
dependencies = [
    "yt-dlp[default]>=2026.10.26",
    "deno>=2.3,<3",
    "sentence-transformers>=5,<6",
    "transformers>=5.1,<6",
    "numpy>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
yt = "yt_cli.launcher:main"
yt-collect = "yt_cli.launcher:collector_entry"
yt-search = "yt_cli.launcher:search_entry"
yt-web = "yt_web.server:main"

[project.optional-dependencies]
whisper = ["faster-whisper>=1.2,<2", "av>=11,<19"]
gpu = ["nvidia-cublas-cu12>=12,<13", "nvidia-cudnn-cu12>=9,<10"]

[dependency-groups]
dev = ["ruff", "pyrefly", "types-yt-dlp", "httpx"]
whisper = ["faster-whisper>=1.2,<2", "av>=11,<19"]
gpu = ["nvidia-cublas-cu12>=12,<13", "nvidia-cudnn-cu12>=9,<10"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "whisper", "gpu"]

[tool.uv.build-backend]
module-name = ["transcript_collector", "video_search", "yt_cli", "yt_web", "yt_workflows"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "SIM"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src", "."]
check-unannotated-defs = true
